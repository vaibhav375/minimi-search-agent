# Render's free plan puts the demo to sleep after 15 idle minutes, and the next visitor then waits
# 30-60 seconds for it to wake. A light request every few minutes keeps it awake.
# GitHub may run scheduled jobs a few minutes late, and pauses them after 60 days without a commit.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live site
        run: curl --fail --silent --show-error --max-time 120 --output /dev/null --write-out "HTTP %{http_code} in %{time_total}s\n" https://recall-search-agent.onrender.com/api/conversations
