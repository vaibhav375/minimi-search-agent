<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="A web-search agent that cites its sources and remembers what you asked, and when." />
  <title>Recall: search with a memory</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#0c0b09" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wght@400;600&display=swap" />
  <style>
    /* One typeface, used at the two ends of its width axis: ultra-condensed for the wordmark,
       extended for headings, normal for reading. Mono is for dates, steps and sources. */
    :root {
      --ink: #0c0b09; --paper: #f2efe6; --mark: #ffe03d; --dim: #8a867b; --line: #2a2823; --alert: #ff7a66;
      --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --gutter: clamp(16px, 3.4vw, 44px);
      --measure: 780px;
      --expo: cubic-bezier(.19, 1, .22, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); font-size: 16.5px; line-height: 1.62;
      font-variation-settings: "wdth" 100; -webkit-font-smoothing: antialiased; overflow: hidden;
    }
    ::selection { background: var(--mark); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    .wide { font-variation-settings: "wdth" 125; font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; }

    #field { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

    /* Slow-moving glow behind everything: three soft blobs in the accent's warm range drift on long loops. */
    .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .aurora i { position: absolute; width: 72vmax; height: 72vmax; border-radius: 50%; filter: blur(60px); will-change: transform; }
    .aurora i:nth-child(1) { left: -26vmax; top: -34vmax; background: radial-gradient(closest-side, rgba(255, 224, 61, .30), transparent); animation: drift-a 22s ease-in-out infinite alternate; }
    .aurora i:nth-child(2) { right: -30vmax; top: 8vh; background: radial-gradient(closest-side, rgba(255, 140, 46, .20), transparent); animation: drift-b 29s ease-in-out infinite alternate; }
    .aurora i:nth-child(3) { left: 12vw; bottom: -44vmax; background: radial-gradient(closest-side, rgba(255, 96, 128, .15), transparent); animation: drift-c 35s ease-in-out infinite alternate; }
    @keyframes drift-a { 50% { transform: translate(24vw, 20vh) scale(1.12); } 100% { transform: translate(42vw, 4vh) scale(.94); } }
    @keyframes drift-b { 50% { transform: translate(-28vw, 24vh) scale(.88); } 100% { transform: translate(-8vw, 42vh) scale(1.16); } }
    @keyframes drift-c { 50% { transform: translate(-16vw, -28vh) scale(1.2); } 100% { transform: translate(22vw, -16vh) scale(1); } }

    /* Big headings: a second colour shows through a soft circle that follows the pointer. */
    .lensed { position: relative; }
    .lens { position: absolute; inset: 0; padding: inherit; text-align: inherit; pointer-events: none; color: var(--lens, var(--paper));
      -webkit-mask-image: radial-gradient(circle calc(var(--r, 0) * 1px) at var(--mx, 50%) var(--my, 50%), #000 90%, transparent 100%);
      mask-image: radial-gradient(circle calc(var(--r, 0) * 1px) at var(--mx, 50%) var(--my, 50%), #000 90%, transparent 100%); }
    /* Words that rise into place: each word sits in its own clipping box. */
    .wm { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
    .w { display: inline-block; }

    /* ---- header ---- */
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; gap: 14px;
      padding: 16px var(--gutter); background: linear-gradient(var(--ink) 40%, transparent); }
    .logo { width: 52px; height: 52px; border-radius: 12px; background: var(--mark); color: var(--ink); display: grid; place-items: center;
      font-variation-settings: "wdth" 62; font-weight: 900; font-size: 40px; line-height: 1; text-decoration: none; flex: none;
      transition: transform .5s var(--expo); }
    .logo:hover { transform: rotate(-8deg) scale(1.06); }
    #crumb { flex: 1; min-width: 0; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav { display: flex; align-items: center; gap: 6px; }
    .nav button { padding: 10px 12px; border-radius: 8px; }
    .nav button:hover { color: var(--mark); }

    /* ---- scrolling stage ---- */
    #scroller { position: relative; z-index: 1; height: 100dvh; overflow-y: auto; overflow-x: clip; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    #stage { padding: 96px var(--gutter) 150px; min-height: 100%; }

    /* ---- landing ---- */
    .hero-top { display: flex; justify-content: space-between; gap: 16px; color: var(--dim); }
    .wordmark { margin: 6px 0 0; color: var(--mark); font-weight: 900; line-height: .78; white-space: nowrap; text-transform: uppercase;
      letter-spacing: -.012em; font-size: 30vw; overflow: clip; overflow-clip-margin: 0; padding-top: .06em; }
    .wordmark { --lens: var(--paper); }
    .wordmark .ch { display: inline-block; font-variation-settings: "wdth" var(--w, 62); }
    .tagline { --lens: var(--mark); margin: clamp(10px, 1.6vw, 22px) 0 0; text-align: right; font-size: clamp(20px, 4.1vw, 60px); line-height: 1; }
    .lede { display: grid; grid-template-columns: minmax(0, 34em) auto; justify-content: space-between; align-items: end; gap: 24px; margin-top: clamp(22px, 3.4vw, 46px); }
    .lede p { margin: 0; font-size: clamp(17px, 1.55vw, 21px); line-height: 1.45; }
    .byline { color: var(--paper); text-decoration: underline; text-underline-offset: 4px; white-space: nowrap; }
    .byline:hover { color: var(--mark); }

    .slab { --tile: 76px; position: relative; isolation: isolate; container-type: inline-size; display: flex; align-items: stretch; width: 100%;
      margin-top: clamp(28px, 4vw, 56px); border-radius: 16px; border: 1px solid var(--dim); color: var(--paper); text-align: left; overflow: hidden;
      transition: border-color .4s, color .5s var(--expo); }
    .slab::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--mark); transform: scaleY(0); transform-origin: top; transition: transform .6s var(--expo); }
    .slab .tile { flex: none; width: var(--tile); margin: 6px; border-radius: 11px; background: var(--mark); color: var(--ink); display: grid; place-items: center;
      transition: transform .8s var(--expo), background-color .4s, color .4s; }
    .slab .label { padding: 18px 20px 18px 14px; display: grid; gap: 4px; align-content: center; transition: transform .8s var(--expo); }
    .slab b { font-size: clamp(18px, 2.1vw, 28px); line-height: 1; }
    .slab small { font-size: 14.5px; line-height: 1.35; color: var(--dim); transition: color .5s; }
    @media (hover: hover) {
      .slab:hover { border-color: var(--mark); color: var(--ink); }
      .slab:hover::after { transform: scaleY(1); transform-origin: bottom; }
      .slab:hover small { color: rgba(12, 11, 9, .72); }
      /* The arrow tile travels the whole width; the label slides into the space it leaves. */
      .slab:hover .tile { transform: translateX(calc(100cqw - 100% - 12px)); background: var(--ink); color: var(--mark); }
      .slab:hover .label { transform: translateX(calc(-1 * var(--tile) - 6px)); }
    }
    .note { margin-top: clamp(28px, 4vw, 56px); color: var(--dim); }

    .tries { margin-top: clamp(26px, 3.6vw, 48px); border-top: 1px solid var(--line); }
    .tries h2 { margin: 0; padding: 14px 0; color: var(--dim); font-weight: 400; }
    .try { display: grid; grid-template-columns: 76px 1fr 28px; gap: 14px; align-items: baseline; width: 100%; padding: 17px 0; border-top: 1px solid var(--line); text-align: left; }
    .try .tag { color: var(--dim); }
    .try .q { font-size: clamp(17px, 1.7vw, 22px); line-height: 1.3; font-weight: 500; }
    .try .go { justify-self: end; display: inline-grid; overflow: hidden; color: var(--dim); transition: color .25s; }
    .try .go svg { grid-area: 1 / 1; transition: transform .6s var(--expo); }
    .try .go svg + svg { transform: translateX(-140%); }
    .try:hover .q, .try:hover .tag { color: var(--mark); }
    .try:hover .go { color: var(--mark); }
    .try:hover .go svg:first-child { transform: translateX(140%); }
    .try:hover .go svg + svg { transform: none; }

    /* ---- conversation ---- */
    .thread { max-width: var(--measure); margin: 0 auto; }
    .turn { padding: 30px 0 34px; border-top: 1px solid var(--line); }
    .turn:first-child { border-top: 0; padding-top: 12px; }
    .ask { margin: 0 0 16px; font-variation-settings: "wdth" 112; font-weight: 700; font-size: clamp(21px, 2.3vw, 29px); line-height: 1.18; letter-spacing: -.01em; white-space: pre-wrap; overflow-wrap: anywhere; }
    .steps { display: grid; gap: 7px; margin-bottom: 16px; color: var(--dim); text-transform: none; letter-spacing: 0; }
    .steps span { display: flex; gap: 9px; align-items: baseline; overflow-wrap: anywhere; }
    .steps span::before { content: ""; flex: none; width: 6px; height: 6px; background: var(--dim); transform: translateY(-1px); }
    .steps .recall { color: var(--mark); }
    .steps .recall::before { background: var(--mark); }
    .answer { overflow-wrap: anywhere; }
    .answer > :first-child { margin-top: 0; }
    .answer > :last-child { margin-bottom: 0; }
    .answer h1, .answer h2, .answer h3, .answer h4 { font-variation-settings: "wdth" 112; font-size: 18px; line-height: 1.25; margin: 1.5em 0 .5em; }
    .answer strong { font-weight: 700; }
    .answer a { color: var(--paper); text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; }
    .answer a:hover { color: var(--mark); }
    .answer ul, .answer ol { padding-left: 1.25em; }
    .answer li { margin: .3em 0; }
    .answer blockquote { margin: 1em 0; padding-left: 16px; border-left: 2px solid var(--mark); color: var(--dim); }
    .answer code { font-family: var(--mono); font-size: .82em; background: var(--line); padding: 2px 6px; border-radius: 4px; }
    .answer table { display: block; overflow-x: auto; border-collapse: collapse; margin: 1.1em 0; font-size: 14.5px; line-height: 1.45; }
    .answer th { font-family: var(--mono); font-size: 10.5px; font-weight: 400; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 0 16px 9px 0; border-bottom: 1px solid var(--dim); white-space: nowrap; }
    .answer td { padding: 10px 16px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 96px; }
    /* A citation is a highlighter tab: the same yellow as everything you can act on. */
    a.cite { display: inline-block; min-width: 17px; padding: 0 4px; margin: 0 1.5px; border-radius: 3px; background: var(--mark); color: var(--ink);
      font-family: var(--mono); font-size: 10px; font-weight: 600; line-height: 16px; text-align: center; text-decoration: none; vertical-align: 2px; }
    a.cite:hover { background: var(--paper); color: var(--ink); }
    .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
    .sources a { display: inline-flex; gap: 7px; align-items: center; max-width: 250px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; color: var(--dim); text-decoration: none; text-transform: none; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sources a b { color: var(--mark); font-weight: 600; }
    .sources a:hover { border-color: var(--mark); color: var(--paper); }
    .error { color: var(--alert); margin: .6em 0 0; }
    .cursor::after { content: ""; display: inline-block; width: 9px; height: 1.05em; margin-left: 3px; background: var(--mark); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---- composer: the one slab you always have ---- */
    form { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 28px var(--gutter) 18px; background: linear-gradient(transparent, var(--ink) 46%); pointer-events: none; }
    .composer { pointer-events: auto; display: flex; align-items: flex-end; gap: 8px; max-width: var(--measure); margin: 0 auto; padding: 7px 7px 7px 20px; border-radius: 16px; background: var(--mark); }
    body.landing .composer { max-width: none; }
    textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 18px; font-weight: 500; line-height: 1.4; max-height: 180px; padding: 11px 0; }
    textarea::placeholder { color: rgba(12, 11, 9, .55); }
    .composer:focus-within { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--paper); }
    #send { flex: none; width: 48px; height: 48px; border-radius: 11px; background: var(--ink); color: var(--mark); display: grid; place-items: center; transition: transform .2s; }
    #send:hover:not(:disabled) { transform: translateY(-2px); }
    #send:disabled { opacity: .35; cursor: default; }

    /* ---- memory tab ---- */
    body.memory form { display: none; }
    body.memory #stage { padding-bottom: 90px; }
    .nav button[aria-current="page"] { color: var(--mark); }
    .mem-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
    .mem-title { --lens: var(--paper); margin: 0; color: var(--mark); font-weight: 900; text-transform: uppercase; line-height: .8; letter-spacing: -.012em;
      font-variation-settings: "wdth" var(--w, 62); font-size: clamp(56px, 16vw, 220px); }
    .mem-link { margin: 14px 0 0; color: var(--dim); text-transform: none; letter-spacing: 0; }
    .mem-link button { color: var(--mark); text-decoration: underline; text-underline-offset: 3px; }
    .mem-count { margin: 0; padding-bottom: 6px; color: var(--dim); text-align: right; }
    .mem-search { display: flex; align-items: center; gap: 14px; margin-top: clamp(22px, 3vw, 40px); border-bottom: 2px solid var(--line); transition: border-color .25s; }
    .mem-search:focus-within { border-color: var(--mark); }
    .mem-search svg { flex: none; color: var(--dim); }
    .mem-search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--paper); font: inherit; font-weight: 500; font-size: clamp(20px, 2.3vw, 30px); padding: 14px 0; }
    .mem-search input::placeholder { color: var(--dim); }
    .mem-search input::-webkit-search-cancel-button { filter: invert(1); }
    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); cursor: pointer; transition: color .2s, border-color .2s; }
    .chip:hover { color: var(--paper); border-color: var(--dim); }
    .chip[aria-pressed="true"], .chip.set { background: var(--mark); border-color: var(--mark); color: var(--ink); }
    .chip input { background: transparent; border: 0; outline: 0; padding: 0; color: inherit; font: inherit; color-scheme: dark; }
    .chip.set input { color-scheme: light; }
    .interp { margin: 16px 0 0; color: var(--mark); text-transform: none; letter-spacing: 0; }
    .day { margin-top: clamp(26px, 3vw, 42px); }
    .day h3 { display: flex; align-items: center; gap: 14px; margin: 0; color: var(--dim); font-weight: 400; }
    .day h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .mem-item { display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 240px); gap: 4px 22px; width: 100%; padding: 18px 0; border-bottom: 1px solid var(--line); text-align: left; }
    .mem-item:last-child { border-bottom: 0; }
    .mem-item time { grid-row: 1 / span 2; color: var(--dim); padding-top: 5px; }
    .mem-item .t { grid-column: 2; font-variation-settings: "wdth" 108; font-weight: 700; font-size: clamp(17px, 1.6vw, 21px); line-height: 1.3; transition: color .2s; }
    .mem-item .p { grid-column: 2; color: var(--dim); font-size: 14.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .mem-item .meta { grid-column: 3; grid-row: 1 / span 2; justify-self: end; display: grid; gap: 6px; align-content: start; padding-top: 5px; color: var(--dim); text-align: right; }
    .mem-item .meta b { color: var(--paper); font-weight: 600; }
    .mem-item:hover .t { color: var(--mark); }
    mark { background: var(--mark); color: var(--ink); border-radius: 2px; padding: 0 2px; }
    .mem-empty { margin-top: 44px; color: var(--dim); font-size: 17px; }
    .mem-empty button { color: var(--mark); text-decoration: underline; text-underline-offset: 4px; }

    @media (max-width: 640px) {
      .lede { grid-template-columns: 1fr; }
      .try { grid-template-columns: 1fr 22px; }
      .try .tag { grid-column: 1 / -1; }
      .slab { --tile: 58px; }
      .logo { width: 44px; height: 44px; font-size: 34px; border-radius: 10px; }
      #crumb { display: none; }
      .nav { margin-left: auto; }
      .mem-head { flex-direction: column; align-items: flex-start; }
      .mem-count { text-align: left; }
      .mem-item { grid-template-columns: 1fr; }
      .mem-item time, .mem-item .t, .mem-item .p, .mem-item .meta { grid-column: 1; grid-row: auto; justify-self: start; text-align: left; padding: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .cursor::after, .aurora i { animation: none; } * { transition: none !important; } }
  </style>
</head>
<body class="landing">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="field" aria-hidden="true"></canvas>

  <header>
    <a class="logo" href="/" id="home" aria-label="Recall, start a new chat">R</a>
    <div class="mono" id="crumb"></div>
    <nav class="nav">
      <button class="mono" id="new" type="button">New chat</button>
      <button class="mono" id="memoryTab" type="button">Memory</button>
    </nav>
  </header>

  <div id="scroller"><main id="stage"></main></div>

  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Your question"></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M10 17V4M4 9.5 10 3.5l6 6" /></svg>
      </button>
    </div>
  </form>

  <script src="/vendor/gsap.js"></script>
  <script src="/vendor/lenis.js"></script>
  <script type="module">
    import { marked } from "/vendor/marked.js";
    import DOMPurify from "/vendor/purify.js";

    const $ = (id) => document.getElementById(id);
    const stage = $("stage"), input = $("input"), send = $("send"), scroller = $("scroller");
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const REPO = "https://github.com/vaibhav375/minimi-search-agent";
    let conversationId = null, busy = false, thread = null;

    // A random id per browser keeps each visitor's history separate on a shared deployment. A history
    // link (?history=<id>, copied from the Memory tab) switches this browser to that history, so the same
    // memory can be opened on another device. It is a private link, not a login.
    const visitor = (() => {
      const shared = new URLSearchParams(location.search).get("history");
      const valid = shared && /^[\w-]{8,64}$/.test(shared) ? shared : null;
      try {
        if (valid) localStorage.visitor = valid;
        return localStorage.visitor ??= crypto.randomUUID();
      } catch { return valid ?? crypto.randomUUID(); }
    })();
    if (location.search.includes("history=")) history.replaceState(null, "", location.pathname + location.hash);
    const api = (path, init = {}) => fetch(path, { ...init, headers: { ...init.headers, "x-visitor": visitor } });

    const SAMPLES = [
      ["Finance", "What did the US Federal Reserve decide at its most recent meeting, and how did markets react?"],
      ["Tech", "What's new in the latest Node.js release?"],
      ["Art", "Which major art exhibitions are opening in London and New York this month?"],
      ["Science", "What has NASA announced about its Artemis missions recently?"],
      ["Sport", "Who won the most recent Formula 1 race, and how does the championship stand?"],
      ["Travel", "What do UK citizens need to visit Japan right now: visa, passport rules, entry forms?"],
      ["Film", "What are the highest-grossing films of the year so far?"],
      ["Gadgets", "Compare the newest iPhone and Pixel flagships on price and battery life."],
    ];
    const ARROW = `<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M3 11h15M12.5 5l6 6-6 6"/></svg>`;
    
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
    const stamp = (d) => new Date(d).toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short" }).replace(",", "");

    // ---- text motion helpers ----
    const hover = matchMedia("(hover: hover)").matches;
    // "Search with a memory" -> each word in its own clipping box, so it can rise into place.
    const words = (text) => esc(text).split(/\s+/).map((w) => `<span class="wm"><span class="w">${w}</span></span>`).join(" ");

    // Big headings: a copy of the heading in a second colour, shown only inside a circle that follows
    // the pointer. The copy shares the original's letters, so intro animations move both together.
    function addLens(el) {
      if (calm || !hover || !el || el.querySelector(".lens")) return;
      const lens = document.createElement("span");
      lens.className = "lens";
      lens.setAttribute("aria-hidden", "true");
      lens.innerHTML = el.innerHTML;
      el.classList.add("lensed");
      el.append(lens);
      const at = (e) => {
        const r = el.getBoundingClientRect();
        el.style.setProperty("--mx", `${e.clientX - r.left}px`);
        el.style.setProperty("--my", `${e.clientY - r.top}px`);
      };
      el.addEventListener("pointerenter", (e) => { at(e); gsap.to(el, { "--r": Math.max(70, Math.min(260, el.offsetHeight * .55)), duration: .6, ease: "expo.out" }); });
      el.addEventListener("pointermove", at);
      el.addEventListener("pointerleave", () => gsap.to(el, { "--r": 0, duration: .5, ease: "power3.out" }));
    }

    // Small mono labels resolve out of random characters.
    const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/#+";
    function scramble(el, duration = 650) {
      if (calm || !el) return;
      const text = el.dataset.text ??= el.textContent;
      const start = performance.now();
      const tick = (now) => {
        const p = Math.min(1, (now - start) / duration);
        el.textContent = [...text].map((c, i) => (c === " " || i < p * text.length ? c : GLYPHS[(Math.random() * GLYPHS.length) | 0])).join("");
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    // Rows slide in as they scroll into view.
    function revealOnScroll(els) {
      if (calm || !els.length) return;
      gsap.set(els, { opacity: 0, y: 26 });
      const io = new IntersectionObserver((entries) => {
        const shown = entries.filter((e) => e.isIntersecting).map((e) => e.target);
        shown.forEach((el) => io.unobserve(el));
        if (shown.length) gsap.to(shown, { opacity: 1, y: 0, duration: .8, ease: "expo.out", stagger: .07 });
      }, { root: scroller, rootMargin: "0px 0px -8% 0px" });
      els.forEach((el) => io.observe(el));
    }

    // ---- smooth scrolling (Lenis) on the one scrolling surface ----
    const lenis = calm ? null : new Lenis({ wrapper: scroller, content: stage, autoRaf: true, lerp: 0.11 });
    const nearBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;
    function toBottom(force) {
      if (!force && !nearBottom()) return;
      if (lenis) lenis.scrollTo(scroller.scrollHeight, { immediate: true, force: true });
      else scroller.scrollTop = scroller.scrollHeight;
    }
    function toTop() { if (lenis) lenis.scrollTo(0, { immediate: true, force: true }); else scroller.scrollTop = 0; }

    // ---- ambient field: drifting points, and a ring that goes out each time the agent searches ----
    const field = (() => {
      const canvas = $("field"), ctx = canvas.getContext("2d");
      let w = 0, h = 0, dots = [], rings = [], last = 0;
      function size() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        dots = Array.from({ length: Math.round((w * h) / 16000) }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.1 + .3, v: Math.random() * .12 + .03 }));
      }
      function ping() { if (!calm) rings.push({ x: w * (.2 + Math.random() * .6), y: h * (.2 + Math.random() * .5), t: 0 }); }
      function frame(now) {
        const dt = Math.min(now - last, 50); last = now;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "rgba(242,239,230,.34)";
        for (const d of dots) {
          if (!calm) { d.y -= d.v * dt * .06; if (d.y < -2) { d.y = h + 2; d.x = Math.random() * w; } }
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill();
        }
        rings = rings.filter((r) => (r.t += dt / 2600) < 1);
        for (const r of rings) {
          ctx.strokeStyle = `rgba(255,224,61,${(1 - r.t) * .34})`; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(r.x, r.y, r.t * Math.max(w, h) * .55, 0, 6.283); ctx.stroke();
        }
        if (!calm && !document.hidden) requestAnimationFrame(frame);
      }
      addEventListener("resize", size);
      document.addEventListener("visibilitychange", () => { if (!document.hidden && !calm) { last = performance.now(); requestAnimationFrame(frame); } });
      size(); requestAnimationFrame(frame);
      return { ping };
    })();

    // ---- rendering ----
    // Markdown -> safe HTML, with [n] turned into links to the numbered sources (unknown numbers dropped).
    function render(text, sources) {
      text = text.replace(/【(\d+)(?:†[^】]*)?】/g, "[$1]"); // some models cite as 【1】
      const html = marked.parse(text, { breaks: false }).replace(/\[(\d+)\]/g, (_, n) => {
        const s = sources.get(Number(n));
        return s ? `<a class="cite" href="${esc(s.url)}" title="${esc(s.title)} · ${esc(host(s.url))}">${n}</a>` : "";
      });
      const div = document.createElement("div");
      div.innerHTML = DOMPurify.sanitize(html);
      div.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
      return div.innerHTML;
    }

    function sourceChips(sources) {
      const box = document.createElement("div");
      box.className = "sources mono";
      for (const s of sources) {
        const a = document.createElement("a");
        a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.title = `${s.title}${s.published ? ` (published ${s.published})` : ""}`;
        a.innerHTML = `<b>${s.n}</b>${esc(host(s.url))}`;
        box.append(a);
      }
      return box;
    }

    function addTurn(question, animate) {
      const el = document.createElement("section");
      el.className = "turn";
      el.innerHTML = `<h2 class="ask"></h2><div class="steps mono"></div><div class="answer"></div>`;
      el.querySelector(".ask").innerHTML = animate && !calm ? words(question) : esc(question);
      thread.append(el);
      if (animate && !calm) gsap.from(el.querySelectorAll(".ask .w"), { yPercent: 110, duration: .7, ease: "expo.out", stagger: .025 });
      return { el, steps: el.querySelector(".steps"), answer: el.querySelector(".answer") };
    }

    // Which of the three views is showing: the landing page, a conversation, or the Memory tab.
    function setView(view) {
      document.body.classList.toggle("landing", view === "landing");
      document.body.classList.toggle("memory", view === "memory");
      if (view === "memory") $("memoryTab").setAttribute("aria-current", "page");
      else $("memoryTab").removeAttribute("aria-current");
    }

    function showThread(title) {
      setView("thread");
      stage.innerHTML = `<div class="thread"></div>`;
      thread = stage.firstChild;
      $("crumb").textContent = title ?? "";
    }

    function showLanding() {
      setView("landing");
      thread = null; conversationId = null;
      $("crumb").textContent = "";
      history.replaceState(null, "", "/");
      const today = new Date().toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short", year: "numeric" }).replace(",", "");
      stage.innerHTML = `
        <div class="hero-top mono"><span>Web search agent</span><span>${today}</span></div>
        <h1 class="wordmark" aria-label="Recall">${[..."Recall"].map((c) => `<span class="ch" aria-hidden="true">${c}</span>`).join("")}</h1>
        <p class="tagline wide">${words("Search with a memory")}</p>
        <div class="lede">
          <p>${words("Ask anything and get an answer from the live web, with its sources. Ask again next week and it checks what changed, because it keeps what you asked and when.")}</p>
          <a class="byline mono" href="${REPO}" target="_blank" rel="noopener noreferrer">Built by vaibhav375 · source on GitHub</a>
        </div>
        <div id="demo"></div>
        <section class="tries"><h2 class="mono">Try one</h2>${SAMPLES.map(([tag, q], i) => `<button class="try" type="button" data-i="${i}"><span class="tag mono">${tag}</span><span class="q">${esc(q)}</span><span class="go">${ARROW}${ARROW}</span></button>`).join("")}</section>`;
      stage.querySelectorAll(".try").forEach((b) => (b.onclick = () => { input.value = SAMPLES[b.dataset.i][1]; ask(); }));
      fitWordmark();
      addLens(stage.querySelector(".wordmark"));
      addLens(stage.querySelector(".tagline"));
      toTop();
      checkHistory();
      if (!calm) {
        // The wordmark arrives wide and squeezes down to fit: the width axis is the whole identity.
        gsap.fromTo(".wordmark .ch", { "--w": 125, yPercent: 30, opacity: 0 }, { "--w": 62, yPercent: 0, opacity: 1, duration: 1.15, ease: "expo.out", stagger: .05 });
        gsap.from(".tagline .w", { yPercent: 110, duration: .9, ease: "expo.out", stagger: .08, delay: .35 });
        gsap.from(".lede .w", { yPercent: 110, duration: .8, ease: "expo.out", stagger: .012, delay: .5 });
        gsap.from(".byline, #demo", { y: 22, opacity: 0, duration: .8, ease: "expo.out", stagger: .1, delay: .7 });
        stage.querySelectorAll(".hero-top span, .tries h2").forEach((el) => scramble(el, 900));
        revealOnScroll([...stage.querySelectorAll(".try")]);
      }
    }

    // Size the wordmark so its six letters span the full width exactly.
    function fitWordmark() {
      const el = stage.querySelector(".wordmark");
      if (!el) return;
      // Measured on a hidden copy at the final (condensed) width, so the intro animation cannot skew it.
      const probe = document.createElement("span");
      probe.className = "ch";
      probe.textContent = "Recall";
      probe.style.cssText = "position:absolute;visibility:hidden;font-size:200px;--w:62";
      el.append(probe);
      const natural = probe.getBoundingClientRect().width;
      probe.remove();
      el.style.fontSize = Math.min((el.clientWidth / natural) * 200, innerHeight * .62) + "px";
    }
    addEventListener("resize", fitWordmark);
    document.fonts?.ready.then(fitWordmark);

    // The history slab on the landing page: opens the Memory tab, loading the sample history first
    // for a visitor who has none, so the memory features have something to show.
    function historySlab(hasHistory) {
      const box = $("demo");
      if (!box) return;
      const [title, detail] = hasHistory
        ? ["Show past history", "Everything you have asked, by day, with filters for words and dates."]
        : ["Load sample history", "Adds three past conversations, dated last Monday, last Tuesday and 3 November, and opens them in Memory. Then ask what has changed since."];
      box.innerHTML = `<button class="slab" type="button"><span class="tile">${ARROW}</span><span class="label"><b class="wide">${title}</b><small>${detail}</small></span></button>`;
      box.firstChild.onclick = async () => {
        box.firstChild.disabled = true;
        if (!hasHistory) {
          const res = await api(`/api/demo?tz=${encodeURIComponent(tz)}`, { method: "POST" }).catch(() => null);
          if (!res?.ok) { box.innerHTML = `<p class="note mono" style="color:var(--alert)">Could not load the sample history. Try again.</p>`; return; }
          field.ping();
        }
        location.hash = "memory";
      };
    }

    async function checkHistory() {
      let items = [];
      try { items = await (await api("/api/conversations")).json(); } catch {}
      historySlab(items.length > 0);
    }

    async function openConversation(id) {
      if (busy) return;
      const res = await api(`/api/conversations/${id}`);
      const messages = res.ok ? await res.json() : [];
      if (!messages.length) return showLanding();
      conversationId = id;
      history.replaceState(null, "", "#" + id);
      showThread(`${stamp(messages[0].createdAt)} · ${messages[0].content}`);
      let turn = null;
      for (const m of messages) {
        if (m.role === "user") { turn = addTurn(m.content, false); continue; }
        if (!turn) continue;
        turn.answer.innerHTML = render(m.content, new Map(m.sources.map((s) => [s.n, s])));
        if (m.sources.length) turn.answer.after(sourceChips(m.sources));
        turn = null;
      }
      // A question whose answer failed has no reply saved; say so rather than leave a gap.
      thread.querySelectorAll(".answer:empty").forEach((a) => (a.innerHTML = `<p class="error">No answer was saved for this question. Ask it again to retry.</p>`));
      if (!calm) gsap.from(".turn", { y: 18, opacity: 0, duration: .5, ease: "power3.out", stagger: .06 });
      toTop();
    }

    async function ask() {
      const text = input.value.trim();
      if (!text || busy) return;
      busy = true; send.disabled = true;
      if (!thread) showThread(text);
      input.value = ""; input.style.height = "";
      const { steps, answer } = addTurn(text, true);
      answer.classList.add("cursor");
      toBottom(true);

      const sources = new Map();
      let raw = "", frame = 0;
      const paint = () => { frame = 0; answer.innerHTML = render(raw, sources); toBottom(); };
      const step = (t, recall) => { const s = document.createElement("span"); s.textContent = t; if (recall) s.className = "recall"; steps.append(s); toBottom(); };
      const fail = (message) => answer.insertAdjacentHTML("beforeend", `<p class="error">${esc(message)}</p>`);

      try {
        const res = await api("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text, conversationId, timezone: tz, locale: navigator.language }),
        });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `The server answered with an error (${res.status}).`);
        const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          let i;
          while ((i = buf.indexOf("\n\n")) >= 0) {
            const block = buf.slice(0, i); buf = buf.slice(i + 2);
            const data = block.split("\n").find((l) => l.startsWith("data: "));
            if (!data) continue;
            const ev = JSON.parse(data.slice(6));
            if (ev.type === "conversation") { conversationId = ev.id; history.replaceState(null, "", "#" + ev.id); }
            else if (ev.type === "status") { const recall = /^(Recalled|No )/.test(ev.text); step(ev.text, recall); if (!recall) field.ping(); }
            else if (ev.type === "search") ev.results.forEach((r) => sources.set(r.n, r));
            else if (ev.type === "text") { raw += ev.delta; if (!frame) frame = requestAnimationFrame(paint); }
            else if (ev.type === "done") {
              raw = raw.replace(/【(\d+)(?:†[^】]*)?】/g, "[$1]").replace(/\s?\[(\d+)\]/g, (m, n) => (sources.has(Number(n)) ? m : ""));
              paint();
              if (ev.sources.length) answer.after(sourceChips(ev.sources));
            }
            else if (ev.type === "error") fail(ev.message);
          }
        }
      } catch (err) {
        fail(err.message || "Could not reach the server. Check your connection and try again.");
      } finally {
        answer.classList.remove("cursor");
        busy = false; send.disabled = false; input.focus();
        toBottom();
      }
    }

    // ---- memory tab: everything you have asked, filterable by words and dates ----
    const PRESETS = [["all", "All time"], ["today", "Today"], ["week", "This week"], ["lastweek", "Last week"], ["month", "This month"]];
    const mem = { q: "", preset: "all", day: "" };
    const ymd = (d) => d.toLocaleDateString("en-CA"); // YYYY-MM-DD in the browser's time zone
    const SEARCH_ICON = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5" stroke-linecap="square"/></svg>`;

    function rangeFor(preset) {
      const t = new Date(), day = (n) => ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate() + n)), sinceMonday = (t.getDay() + 6) % 7;
      if (preset === "today") return { from: day(0), to: day(0) };
      if (preset === "week") return { from: day(-sinceMonday), to: day(0) };
      if (preset === "lastweek") return { from: day(-sinceMonday - 7), to: day(-sinceMonday - 1) };
      if (preset === "month") return { from: ymd(new Date(t.getFullYear(), t.getMonth(), 1)), to: day(0) };
      return {};
    }

    function dayLabel(day) {
      const today = ymd(new Date()), yesterday = ymd(new Date(Date.now() - 86_400_000));
      const long = new Date(day + "T12:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).replace(",", "");
      return day === today ? `Today · ${long}` : day === yesterday ? `Yesterday · ${long}` : long;
    }

    // Wraps the words the search matched (at the start of a word, like the full-text index) in <mark>.
    function highlighter(terms) {
      if (!terms?.length) return esc;
      const re = new RegExp(`(?<![\\p{L}\\p{N}])(?:${terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})[\\p{L}\\p{N}]*`, "giu");
      return (text) => esc(text).replace(re, "<mark>$&</mark>");
    }

    function showMemory() {
      setView("memory");
      thread = null; conversationId = null;
      $("crumb").textContent = "";
      stage.innerHTML = `
        <div class="mem-head"><h1 class="mem-title">Memory</h1><p class="mem-count mono" id="memCount"></p></div>
        <p class="mem-link mono">This history belongs to this browser. <button type="button" id="copyLink">Copy a link to open it on another device</button></p>
        <label class="mem-search">${SEARCH_ICON}<input id="memQ" type="search" autocomplete="off" spellcheck="false" placeholder='Search words or dates, like "last Tuesday postgres"' aria-label="Search your conversations" /></label>
        <div class="chips mono" role="group" aria-label="Filter by date">
          ${PRESETS.map(([key, label]) => `<button class="chip" type="button" data-p="${key}">${label}</button>`).join("")}
          <label class="chip" id="dayChip">On <input id="memDay" type="date" aria-label="Pick a day" /></label>
        </div>
        <p class="interp mono" id="interp" hidden></p>
        <div id="results"></div>`;
      const q = $("memQ"), dayInput = $("memDay");
      q.value = mem.q; dayInput.value = mem.day; dayInput.max = ymd(new Date());
      let timer;
      q.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { mem.q = q.value; loadMemory(); }, 160); };
      stage.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => { mem.preset = b.dataset.p; mem.day = ""; dayInput.value = ""; loadMemory(); }));
      dayInput.onchange = () => { mem.day = dayInput.value; loadMemory(); };
      $("copyLink").onclick = async () => {
        const link = `${location.origin}/?history=${encodeURIComponent(visitor)}`;
        try {
          await navigator.clipboard.writeText(link);
          $("copyLink").textContent = "Link copied. Anyone with it can see this history.";
        } catch {
          prompt("Copy this link to open your history on another device:", link);
        }
      };
      toTop();
      loadMemory(true);
      addLens(stage.querySelector(".mem-title"));
      if (!calm) gsap.fromTo(".mem-title", { "--w": 125, opacity: 0 }, { "--w": 62, opacity: 1, duration: 1, ease: "expo.out" });
      if (matchMedia("(pointer: fine)").matches) q.focus();
    }

    let memSeq = 0;
    async function loadMemory(animate) {
      const seq = ++memSeq;
      stage.querySelectorAll("[data-p]").forEach((b) => b.setAttribute("aria-pressed", String(!mem.day && mem.preset === b.dataset.p)));
      $("dayChip")?.classList.toggle("set", !!mem.day);
      const range = mem.day ? { from: mem.day, to: mem.day } : rangeFor(mem.preset);
      let data = null;
      try {
        const res = await api(`/api/memory?${new URLSearchParams({ q: mem.q, tz, locale: navigator.language, ...range })}`);
        if (res.ok) data = await res.json();
      } catch {}
      const box = $("results");
      if (seq !== memSeq || !box) return; // a newer search has started, or the view changed
      if (!data) { box.innerHTML = `<p class="mem-empty">Could not load your conversations. Check your connection and try again.</p>`; return; }

      const interp = $("interp");
      interp.hidden = !data.interpreted;
      interp.textContent = data.interpreted ? `Reading ${data.interpreted}` : "";
      const filtered = !!(mem.q.trim() || mem.day || mem.preset !== "all");
      const n = data.items.length;
      $("memCount").textContent = `${n} conversation${n === 1 ? "" : "s"}${filtered ? (n === 1 ? " matches" : " match") : ""}`;

      if (!n) {
        box.innerHTML = filtered
          ? `<p class="mem-empty">Nothing matches those filters. <button type="button" id="clearMem">Clear filters</button></p>`
          : `<p class="mem-empty">Nothing here yet. Ask a question, or <button type="button" id="loadDemo">load the sample history</button>.</p>`;
        $("clearMem")?.addEventListener("click", () => { Object.assign(mem, { q: "", preset: "all", day: "" }); showMemory(); });
        $("loadDemo")?.addEventListener("click", async () => { await api(`/api/demo?tz=${encodeURIComponent(tz)}`, { method: "POST" }); field.ping(); loadMemory(true); });
        return;
      }

      const hl = highlighter(data.terms);
      const days = new Map();
      for (const item of data.items) {
        const day = ymd(new Date(item.createdAt));
        if (!days.has(day)) days.set(day, []);
        days.get(day).push(item);
      }
      box.innerHTML = [...days].map(([day, items]) => `
        <section class="day"><h3 class="mono">${dayLabel(day)}</h3>
          ${items.map((it) => `
            <button class="mem-item" type="button" data-id="${it.id}">
              <time class="mono">${new Date(it.createdAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}</time>
              <span class="t">${hl(it.title)}</span>
              <span class="p">${it.preview ? hl(it.preview) : "No answer was saved for this question."}</span>
              <span class="meta mono"><span><b>${it.questions}</b> ${it.questions === 1 ? "question" : "questions"} · <b>${it.sources}</b> ${it.sources === 1 ? "source" : "sources"}</span>${it.domains.length ? `<span>${esc(it.domains.join(" · "))}</span>` : ""}</span>
            </button>`).join("")}
        </section>`).join("");
      box.querySelectorAll(".mem-item").forEach((b) => (b.onclick = () => (location.hash = b.dataset.id)));
      if (animate && !calm) gsap.from(".day", { y: 18, opacity: 0, duration: .5, ease: "power3.out", stagger: .06 });
    }

    // ---- routing: #memory, #<conversation id>, or the landing page ----
    function route() {
      const hash = location.hash.slice(1);
      if (hash === "memory") showMemory();
      else if (Number(hash)) openConversation(Number(hash));
      else showLanding();
    }
    addEventListener("hashchange", () => { if (!busy) route(); });
    $("memoryTab").onclick = () => { if (busy) return; if (location.hash === "#memory") showMemory(); else location.hash = "memory"; };

    document.querySelectorAll(".nav button").forEach((b) => b.addEventListener("pointerenter", () => scramble(b, 400)));

    $("form").onsubmit = (e) => { e.preventDefault(); ask(); };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });
    input.addEventListener("input", () => { input.style.height = ""; input.style.height = input.scrollHeight + "px"; });
    $("new").onclick = $("home").onclick = (e) => { e.preventDefault(); if (!busy) { showLanding(); input.focus(); } };

    route();
  </script>
</body>
</html>
