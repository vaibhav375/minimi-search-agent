<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recall diagrams</title>
<!-- Source for the PNGs in docs/. Each <figure> is screenshotted at 2x by its id. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Martian+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
:root{--ink:#0c0b09;--panel:#151411;--panel2:#1c1b17;--line:#34312b;--paper:#f2efe6;--dim:#9a958a;--mark:#ffe03d;--coral:#ff7a8a;--sans:"Archivo",sans-serif;--mono:"Martian Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;font-family:var(--sans);color:var(--paper);padding:40px;display:grid;gap:40px;justify-content:start}
figure{width:1400px;background:var(--ink);border-radius:28px;padding:52px 56px 56px;position:relative;overflow:hidden;
  background-image:radial-gradient(900px 500px at 8% -10%,rgba(255,224,61,.13),transparent 70%),radial-gradient(700px 500px at 105% 110%,rgba(255,140,46,.09),transparent 70%)}
.kicker{font-family:var(--mono);font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--mark)}
h2{font-size:52px;font-weight:850;font-variation-settings:"wdth" 88;letter-spacing:-.01em;line-height:1;margin:12px 0 10px}
.sub{font-size:22px;color:var(--dim);max-width:1100px;line-height:1.4}
.mono{font-family:var(--mono)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:24px 26px}
.card.hot{border-color:var(--mark)}
.n{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--mark);color:var(--ink);font-family:var(--mono);font-weight:600;font-size:19px;margin-right:12px;vertical-align:middle}
.ct{font-size:27px;font-weight:750;vertical-align:middle}
.tag{display:inline-block;white-space:nowrap;align-self:flex-start;font-family:var(--mono);font-size:15px;letter-spacing:.02em;color:var(--dim);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;margin-top:14px}
.tag.y{color:var(--ink);background:var(--mark);border-color:var(--mark)}
ul.pts{list-style:none;margin-top:14px;display:grid;gap:9px}
ul.pts li{font-size:20px;line-height:1.35;color:#d9d5cb;padding-left:20px;position:relative}
ul.pts li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--mark)}
.arrow{display:grid;place-items:center}
.arrow svg{display:block}
code,.code{font-family:var(--mono)}
.pill{display:inline-block;font-family:var(--mono);font-size:17px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--ink);color:#d9d5cb;white-space:nowrap}
.pill.y{border-color:var(--mark);color:var(--mark)}
.small{font-size:18px;color:var(--dim);line-height:1.4}
.y{color:var(--mark)}
.strike{text-decoration:line-through;text-decoration-color:var(--coral);text-decoration-thickness:2px;color:var(--dim)}

/* 1 · one turn */
#turn .ct{font-size:25px}
#turn .row{display:grid;grid-template-columns:230px 44px 1fr 44px 1fr 44px 1fr;align-items:stretch;margin-top:40px}
#turn .ask{display:flex;flex-direction:column;justify-content:center;gap:14px}
#turn .bubble{background:var(--mark);color:var(--ink);border-radius:22px 22px 22px 6px;padding:20px 22px;font-size:21px;font-weight:650;line-height:1.3}
#turn .store{margin-top:30px;display:grid;grid-template-columns:230px 1fr;gap:44px;align-items:center}
#turn .db{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#turn .db .card{padding:18px 22px;display:flex;align-items:center;gap:16px}
#turn .db b{font-size:22px}
#turn .ups{display:grid;grid-template-columns:230px 44px 1fr 44px 1fr 44px 1fr;margin-top:14px;height:34px}

/* 2 · recall */
#recall .q{margin-top:34px;display:flex;align-items:center;gap:22px}
#recall .q .bubble{background:var(--mark);color:var(--ink);border-radius:22px 22px 22px 6px;padding:20px 26px;font-size:25px;font-weight:650}
#recall .steps{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:22px;margin-top:30px}
#recall .steps .card{display:flex;flex-direction:column}
#recall .when{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
#recall .hit{margin-top:14px;display:grid;gap:10px}
#recall .hit div{font-size:19px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--ink);line-height:1.3}
#recall .hit div.ok{border-color:var(--mark)}
#recall .hit .d{font-family:var(--mono);font-size:15px;color:var(--dim);display:block;margin-bottom:4px}
#recall .hit .ok .d{color:var(--mark)}
#recall pre{margin-top:26px;background:#090807;border:2px solid var(--line);border-radius:18px;padding:24px 26px;font-family:var(--mono);font-size:16.5px;line-height:1.6;color:#cfcabe;white-space:pre-wrap}
#recall pre .t{color:var(--mark)}
#recall pre .c{color:var(--dim)}

/* 3 · search loop */
#loop .lane{display:grid;grid-template-columns:250px 1fr;gap:26px;margin-top:26px;align-items:stretch}
#loop .lane:first-of-type{margin-top:38px}
#loop .who{display:flex;flex-direction:column;justify-content:center;align-self:stretch}
#loop .who .ct{font-size:25px}
#loop .calls{display:flex;flex-direction:column;gap:12px}
#loop .q3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:4px}
#loop .q3 .pill{white-space:normal;line-height:1.4;font-size:16px;padding:12px 14px}
#loop .res{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
#loop .res .pill b{color:var(--mark)}
#loop .note{font-family:var(--mono);font-size:16px;line-height:1.55;color:#cfcabe;background:#090807;border:1.5px dashed var(--line);border-radius:14px;padding:14px 18px}
#loop .caps{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}

/* 4 · models */
#models .chain{display:grid;grid-template-columns:1fr 70px 1fr 70px 1fr;align-items:center;margin-top:40px}
#models .m{text-align:center;padding:28px 20px}
#models .m .ct{display:block;font-size:30px;margin-top:4px}
#models .m .host{font-family:var(--mono);font-size:17px;color:var(--dim);margin-top:8px}
#models .rules{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px}
#models .rules .card{padding:22px}
#models .rules b{display:block;font-size:22px;margin-bottom:8px}
#models .rules p{font-size:19px;line-height:1.4;color:#d9d5cb}
#models .rules .mono{font-size:16px;color:var(--mark)}
</style>
</head>
<body>

<!-- ================= 1 · ONE TURN ================= -->
<figure id="turn">
  <div class="kicker">How it works</div>
  <h2>One question, end to end</h2>
  <p class="sub">The model has exactly one tool. Memory runs as plain code before the model; every answer is saved with its date for next time.</p>

  <div class="row">
    <div class="ask">
      <div class="bubble">Last Tuesday I asked about Postgres hosting. Has the pricing changed?</div>
      <span class="small mono">browser · streamed back over SSE</span>
    </div>
    <div class="arrow"><svg width="44" height="30" viewBox="0 0 44 30"><path d="M2 15h34M28 6l10 9-10 9" fill="none" stroke="#ffe03d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="card">
      <span class="n">1</span><span class="ct">Recall, in code</span>
      <ul class="pts">
        <li>Spots a reference to the past ("I asked")</li>
        <li>Resolves "last Tuesday" to real dates in your time zone</li>
        <li>Pulls the matching chat from SQLite</li>
      </ul>
      <span class="tag">src/recall.ts · no model</span>
    </div>
    <div class="arrow"><svg width="44" height="30" viewBox="0 0 44 30"><path d="M2 15h34M28 6l10 9-10 9" fill="none" stroke="#ffe03d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="card hot">
      <span class="n">2</span><span class="ct">Model ⇄ web_search</span>
      <ul class="pts">
        <li>Plans its searches, runs them in parallel</li>
        <li>Exa for index search, Firecrawl to read a page live</li>
        <li>At most 3 model calls and 10 searches</li>
      </ul>
      <p class="small mono" style="margin-top:12px;font-size:15px">Qwen → gpt-oss → ASI:One</p>
      <span class="tag y">the one tool</span>
    </div>
    <div class="arrow"><svg width="44" height="30" viewBox="0 0 44 30"><path d="M2 15h34M28 6l10 9-10 9" fill="none" stroke="#ffe03d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="card">
      <span class="n">3</span><span class="ct">Cited answer</span>
      <ul class="pts">
        <li>Every claim cites a numbered source [n]</li>
        <li>Numbers that match no source are removed</li>
        <li>Saved with its date and the sources it cited</li>
      </ul>
      <span class="tag">src/agent.ts</span>
    </div>
  </div>

  <div class="ups">
    <div></div><div></div>
    <div class="arrow"><svg width="30" height="34" viewBox="0 0 30 34"><path d="M15 32V6M6 14l9-10 9 10" fill="none" stroke="#9a958a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div></div><div></div><div></div>
    <div class="arrow"><svg width="30" height="34" viewBox="0 0 30 34"><path d="M15 2v26M6 20l9 10 9-10" fill="none" stroke="#9a958a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
  <div class="store">
    <span class="small mono">memory</span>
    <div class="db">
      <div class="card"><b>SQLite</b><span class="small">dated transcripts · sources · full-text index</span></div>
      <span class="small">⇄</span>
      <div class="card"><b>Turso</b><span class="small">durable copy, restored on startup</span></div>
    </div>
  </div>
</figure>

<!-- ================= 2 · RECALL ================= -->
<figure id="recall">
  <div class="kicker">Memory</div>
  <h2>How "last Tuesday" is found</h2>
  <p class="sub">Memory is retrieval, not a tool. It runs in milliseconds before the model, and tells the model plainly what it found or didn't.</p>

  <div class="q">
    <div class="bubble">“Last Tuesday I asked you about Postgres hosting. Has the pricing changed?”</div>
    <span class="small mono">asked Fri 13 Nov 2026</span>
  </div>

  <div class="steps">
    <div class="card">
      <span class="ct"><span class="y mono">A</span>&nbsp; About the past?</span>
      <p class="small" style="margin-top:12px">A cue phrase matches: <span class="y">“I asked”</span>. No cue, no lookup, so ordinary questions pay nothing.</p>
      <span class="tag">regex · isRecall()</span>
    </div>
    <div class="card">
      <span class="ct"><span class="y mono">B</span>&nbsp; Which dates?</span>
      <p class="small" style="margin-top:12px">"Last Tuesday" said on a Friday is ambiguous, so both are checked:</p>
      <div class="when"><span class="pill y">Tue 10 Nov</span><span class="pill">Tue 3 Nov</span></div>
      <span class="tag">chrono-node · your time zone</span>
    </div>
    <div class="card">
      <span class="ct"><span class="y mono">C</span>&nbsp; Which chat?</span>
      <p class="small" style="margin-top:12px">Chats on those dates, ranked by topic (postgres, hosting, pricing):</p>
      <div class="hit">
        <div class="ok"><span class="d">Tue 10 Nov · kept</span>Which Postgres hosting should I use for a small SaaS…</div>
        <div><span class="d">Tue 3 Nov · off topic, dropped</span><span class="strike">What is the latest version of Node.js…</span></div>
      </div>
      <span class="tag">SQLite · full-text search (bm25)</span>
    </div>
  </div>

  <pre><span class="t">&lt;memory&gt;</span>
<span class="t">Lookup:</span> "Last Tuesday" means Tuesday 10 November 2026 or Tuesday 3 November 2026. Found 1 past
conversation on that date: "Which Postgres hosting should I use for a small SaaS: Sup…" (Tuesday 10 November 2026).
For "has anything changed since then", the reference date is Tuesday 10 November 2026: use
<span class="t">published_after "2026-11-10"</span> on searches for news and announcements.
<span class="c">&lt;conversation title="Which Postgres hosting…" date="Tuesday 10 November 2026"&gt; …what was asked and answered, and its sources… &lt;/conversation&gt;</span>
<span class="t">&lt;/memory&gt;</span></pre>
</figure>

<!-- ================= 3 · SEARCH LOOP ================= -->
<figure id="loop">
  <div class="kicker">The one tool</div>
  <h2>A capped search loop</h2>
  <p class="sub">One model, no router or planner. It fans out one search per item, and the last call can't search at all, so every question ends with an answer.</p>

  <div class="lane">
    <div class="who card"><span class="ct">Model call 1</span><span class="small" style="margin-top:6px">plans, then searches in parallel</span></div>
    <div class="calls">
      <div class="q3">
        <span class="pill">web_search({ query: "Supabase pricing Pro plan", domains: ["supabase.com"], fresh: true })</span>
        <span class="pill">web_search({ query: "Neon pricing plans Launch Scale", domains: ["neon.com"], fresh: true })</span>
        <span class="pill">web_search({ query: "AWS RDS PostgreSQL pricing db.t4g.micro", domains: ["aws.amazon.com"], fresh: true })</span>
      </div>
      <div class="res">
        <span class="pill"><b>[1]</b> supabase.com</span><span class="pill"><b>[2]</b> supabase.com</span><span class="pill"><b>[3]</b> neon.com</span><span class="pill"><b>[4]</b> neon.com</span><span class="pill"><b>[5]</b> aws.amazon.com</span>
        <span class="small" style="align-self:center;margin-left:6px">numbered once for the whole turn</span>
      </div>
    </div>
  </div>
  <div class="lane">
    <div class="who card"><span class="ct">Model call 2</span><span class="small" style="margin-top:6px">only if something is missing</span></div>
    <div class="calls" style="justify-content:center"><span class="small">A second round of searches for what the first round didn't cover.</span></div>
  </div>
  <div class="lane">
    <div class="who card hot"><span class="ct">Final call</span><span class="small" style="margin-top:6px">tools withheld</span></div>
    <div class="calls">
      <div class="note">(Note from the app, not the user: you have used all the searches for this question. Write your final answer now from the search results above, citing them…)</div>
      <span class="small">The answer cites [1]–[5]; any number that matches no source is removed before it is saved.</span>
    </div>
  </div>

  <div class="caps">
    <span class="pill y">≤ 3 model calls</span><span class="pill y">≤ 10 searches</span><span class="pill">400-character excerpts, to fit free-tier token limits</span><span class="pill">fresh: true reads the page live</span>
  </div>
</figure>

<!-- ================= 4 · MODELS ================= -->
<figure id="models">
  <div class="kicker">Free, open models</div>
  <h2>A chain of models, with backups</h2>
  <p class="sub">Picked by testing eight free models on the sample questions. When one hits its free-tier limit, the next takes over, without the user seeing an error.</p>

  <div class="chain">
    <div class="card hot m"><span class="tag y" style="margin-top:0">first choice</span><span class="ct">Qwen3.8 27B</span><div class="host">Groq · first output ≈ 0.4 s</div></div>
    <div class="arrow"><svg width="60" height="30" viewBox="0 0 60 30"><path d="M2 15h50M44 6l10 9-10 9" fill="none" stroke="#ffe03d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="card m"><span class="tag" style="margin-top:0">backup</span><span class="ct">gpt-oss-120b</span><div class="host">Groq</div></div>
    <div class="arrow"><svg width="60" height="30" viewBox="0 0 60 30"><path d="M2 15h50M44 6l10 9-10 9" fill="none" stroke="#ffe03d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="card m"><span class="tag" style="margin-top:0">optional</span><span class="ct">asi1</span><div class="host">ASI:One</div></div>
  </div>

  <div class="rules">
    <div class="card"><b>Rate-limited</b><p>That model is parked until its limit resets, and the next one answers. Remembered across questions.</p><p class="mono" style="margin-top:10px">“switching model”</p></div>
    <div class="card"><b>Any other error</b><p>Moves straight on to the next model in the chain.</p></div>
    <div class="card"><b>All parked</b><p>Waits for the soonest reset and says so, rather than failing.</p><p class="mono" style="margin-top:10px">“waiting 12s”</p></div>
    <div class="card"><b>Garbled tool call</b><p>Retried once. A call written out as text is never shown; it's run as a real search.</p></div>
  </div>
</figure>

</body>
</html>
