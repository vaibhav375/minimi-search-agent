# Render blueprint: https://render.com/deploy?repo=https://github.com/vaibhav375/minimi-search-agent
# The free plan's disk is wiped on restart; set the two TURSO_ variables to keep history in Turso.
services:
  - type: web
    name: recall-search-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LLM_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: ASI_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
